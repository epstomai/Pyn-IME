[workspace]
resolver = "2"
members = [
    "crates/ime-core",
    "crates/ime-cli",
    "crates/ime-train",
    "crates/ime-ipc",
    "crates/ime-server",
    "crates/ime-tsf",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows = "0.62.2"
windows-core = "0.62.2"

[profile.release]
lto = "thin"
codegen-units = 1
